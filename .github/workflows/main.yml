name: Build plugin

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Don't copy into Program Files on the build machine
        shell: pwsh
        run: (Get-Content CMakeLists.txt) -replace 'COPY_PLUGIN_AFTER_BUILD TRUE','COPY_PLUGIN_AFTER_BUILD FALSE' | Set-Content CMakeLists.txt

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: JohnPorkCall-VST3
          path: build/JohnPorkCall_artefacts/Release/VST3/
